      <p>OctaDezx is an AI customer care platform that gives your business an always-on AI agent
        to answer customer questions, resolve support requests and capture orders 24/7 across
        WhatsApp, Instagram, Facebook and Shopify, in your customers' own language.</p>

      <h2>What OctaDezx does</h2>
      <ul>
        <li>24/7 AI customer service &amp; support in 50+ languages, auto-detected per customer</li>
        <li>Automated order taking: every price and total is verified server-side against your catalogue</li>
        <li>One-click product import: paste any storefront URL (Shopify, WooCommerce, Wix) and go live in under 10 seconds</li>
        <li>50+ channel integrations: WhatsApp, Instagram, Facebook, Shopify and a website chat widget</li>
        <li>Escalates complex conversations to your human team with full context</li>
        <li>Captures leads automatically and follows up per your plain-language playbook, with one-click outreach into existing chat threads</li>

        <li>Live analytics: resolution rate, response time, orders and revenue</li>
        <li>Enterprise security: end-to-end encryption, role-based access, GDPR-ready, 99.9% uptime SLA</li>
      </ul>

      <h2>How it works</h2>
      <ol>
        <li>Import your catalogue: paste any storefront URL or upload a CSV (~3 minutes)</li>
        <li>Train your AI: add policies, FAQs and brand voice (~5 minutes)</li>
        <li>Connect &amp; go live: plug in WhatsApp, Instagram, Facebook or your web widget (~2 minutes)</li>
      </ol>

      <h2>Pricing</h2>

        <li>Free trial: 24 hours, full access, no credit card required</li>
        <li>Starter: $9/month — 300 unique customers/day, essential automation, core integrations</li>
