# fly.toml app configuration file generated for octadezx-voice on 2026-08-03T01:07:05+06:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'octadezx-voice'
primary_region = 'iad'

[build]
  dockerfile = 'Dockerfile'

[env]
  PORT = '8080'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = 'connections'
    hard_limit = 60
    soft_limit = 40

[checks]
  [checks.health]
    port = 8080
    type = 'http'
    interval = '15s'
    timeout = '3s'
    grace_period = '10s'
    path = '/health'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
  cpus = 1
  memory_mb = 512
